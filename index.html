<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catapulse - Process Studio</title>


  <script src="/config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sw: {
              teal: '#0b3239',       /* Primary Navy/Teal */
              tealHover: '#062126',
              red: '#e61126',        /* Primary Red */
              redHover: '#c40e20',
              gold: '#f5efe6',       /* Secondary Beige/Gold */
              lightGray: '#eee',
              lighterGray: '#fafafa',
              purpleLight: '#ede9ff',
              surface: '#ffffff',
              text: '#0b3239',
              error: '#db0f30'
            }
          },
          fontFamily: {
            sans: ['"GT Ultra Standard"', 'Segoe UI', 'Helvetica Neue', 'Arial', 'sans-serif'],
            serif: ['"ABC Arizona Flare"', 'Georgia', 'Times New Roman', 'serif'],
          },
          borderRadius: {
            'xl': '12px',
            '2xl': '16px',
            'btn': '50px'
          },
          boxShadow: {
            'card': '0 0 8px 0 rgba(11,50,57,.04), 0 2px 5px 0 rgba(11,50,57,.06)',
            'input-focus': '0 0 0 2px #fff, 0 0 0 4px #0b3239'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-sw-lighterGray text-sw-text">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
